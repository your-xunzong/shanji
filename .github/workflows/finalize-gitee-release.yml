name: 正式发布同步到 Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已公开并需要同步到 Gitee 的版本标签
        required: true
        type: string

permissions:
  contents: read

jobs:
  synchronize:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: 获取正式版源码
        uses: actions/checkout@v4

      - name: 下载 GitHub 正式版附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          rm -f release-assets/latest.json release-assets/SHA256SUMS.txt
          task_published_at="$(gh release view "$RELEASE_TAG" --json publishedAt --jq .publishedAt)"
          test -n "$task_published_at"
          echo "RELEASE_PUBLISHED_AT=$task_published_at" >> "$GITHUB_ENV"

      - name: 生成 Gitee 更新清单与校验文件
        run: |
          task_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          node scripts/create-update-manifest.mjs \
            --assets release-assets \
            --version "$task_version" \
            --repo "wu_-ji/shanji" \
            --provider gitee \
            --notes "src/release-notes/v$task_version.md" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --output release-assets/latest.json
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: 正式发布 Gitee 镜像
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          task_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          node scripts/publish-gitee-release.mjs \
            --owner wu_-ji \
            --repo shanji \
            --tag "$RELEASE_TAG" \
            --assets release-assets \
            --notes "src/release-notes/v$task_version.md" \
            --prerelease false \
            --keep 5

      - name: 正式版就绪后更新 Gitee 稳定清单
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
        run: |
          test -n "$GITEE_TOKEN" && test -n "$GITEE_USERNAME"
          task_askpass="$RUNNER_TEMP/gitee-askpass.sh"
          printf '#!/usr/bin/env bash\ncase "$1" in *Username*) printf "%%s" "$GITEE_USERNAME" ;; *) printf "%%s" "$GITEE_TOKEN" ;; esac\n' > "$task_askpass"
          chmod 700 "$task_askpass"
          task_manifest_repo="$RUNNER_TEMP/shanji-update-manifest"
          mkdir "$task_manifest_repo"
          cd "$task_manifest_repo"
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/release-assets/latest.json" latest.json
          git add latest.json
          git commit -m "Update stable manifest for $RELEASE_TAG"
          git remote add gitee https://gitee.com/wu_-ji/shanji.git
          GIT_ASKPASS="$task_askpass" GIT_TERMINAL_PROMPT=0 git push --force gitee HEAD:refs/heads/update
